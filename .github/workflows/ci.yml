name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  MIX_ENV: test

jobs:
  # Formatter output is version-dependent: Elixir 1.19 packs some binary
  # patterns onto one line where 1.16/1.18 wrap them. Running the format check
  # across a matrix therefore cannot pass on every entry at once, so lint is
  # pinned to a single version. Dialyzer and coverage live here too, since a PLT
  # is expensive to build and neither result varies across versions.
  lint:
    name: Lint (Elixir 1.19.5 / OTP 28.1)
    runs-on: ubuntu-latest
    env:
      ELIXIR_VERSION: "1.19.5"
      OTP_VERSION: "28.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-lint-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-lint-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --force --warnings-as-errors

      - name: Credo
        run: mix credo --strict

      # Keyed on the lockfile and the Elixir/OTP pair, so it rebuilds only when
      # one of those changes.
      - name: Cache Dialyzer PLT
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-

      - name: Dialyzer
        run: mix dialyzer --format short

      # Fails below the floor in coveralls.json.
      - name: Coverage
        run: mix coveralls

  # Proves the library actually runs on every Elixir it claims to support
  # (`elixir: "~> 1.16"` in mix.exs). No formatting check here by design.
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.16.3"
            otp: "26.2"
          - elixir: "1.17.3"
            otp: "27.2"
          - elixir: "1.18.3"
            otp: "27.3"
          - elixir: "1.19.5"
            otp: "28.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --force

      - name: Run tests
        run: mix test

  # The examples are the first thing a reader runs and nothing else covers them.
  # Run them twice: once with a font installed, which exercises embedding and
  # subsetting, and once with the helper forced to find none. That second run is
  # what a slim container gets — no fonts are installed in most base images —
  # and it is where two examples crashed undetected, because CI never ran them.
  examples:
    name: Examples (Elixir 1.19.5 / OTP 28.1)
    runs-on: ubuntu-latest
    # Examples are run the way a reader runs them, not under MIX_ENV=test.
    env:
      MIX_ENV: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.1"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-examples-1.19.5-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-examples-1.19.5-

      - name: Install dependencies
        run: mix deps.get

      - name: Run examples with an embedded font
        run: mix examples

      # Every conformance claim in the README rests on veraPDF, so it runs
      # here rather than on whichever machine last had it installed. Through
      # 0.2.0 it did not, which is how a tagged link that was unreachable from
      # the structure tree shipped twice.
      - name: Set up Java for veraPDF
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install veraPDF
        run: |
          curl -sSL -o verapdf-installer.zip https://software.verapdf.org/rel/verapdf-installer.zip
          unzip -q verapdf-installer.zip -d verapdf-installer
          cat > auto-install.xml <<XML
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
              <installpath>$HOME/verapdf</installpath>
            </com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="true"/>
              <pack index="1" name="veraPDF Batch files" selected="true"/>
              <pack index="2" name="veraPDF Validation model" selected="false"/>
              <pack index="3" name="veraPDF Documentation" selected="false"/>
              <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.SimpleFinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          java -jar verapdf-installer/verapdf-greenfield-*/verapdf-izpack-installer-*.jar auto-install.xml

      # A machine-readable report per claim, uploaded whether or not the run
      # passes. A conformance claim a stranger cannot check for themselves is a
      # claim they have to take on trust.
      - name: Validate the examples
        run: |
          set -u
          verapdf="$HOME/verapdf/verapdf"
          mkdir -p verapdf-reports
          "$verapdf" --version | tee verapdf-reports/verapdf-version.txt

          status=0
          while read -r flavour document; do
            pdf="examples/output/$document.pdf"
            "$verapdf" --flavour "$flavour" --format mrr "$pdf" > "verapdf-reports/$document-$flavour.xml"

            if "$verapdf" --flavour "$flavour" --format text "$pdf" | grep -q '^PASS'; then
              echo "PASS  $document  $flavour"
            else
              echo "FAIL  $document  $flavour"
              status=1
            fi
          done <<CLAIMS
          ua1 compliant
          ua1 accessible
          2b archival
          2u archival
          2a archival
          ua1 archival
          CLAIMS

          exit $status

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verapdf-reports
          path: verapdf-reports/
          if-no-files-found: error

      # PDF/A forbids unembedded fonts, so archival.exs cannot conform on this
      # path and exports with `enforce: false` instead. That it still runs is
      # the point: a missing font must not crash an example.
      - name: Run examples with no font installed
        run: mix examples
        env:
          TINCTURE_EXAMPLES_NO_FONTS: "1"
